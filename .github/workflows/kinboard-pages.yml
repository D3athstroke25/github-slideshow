name: Deploy Kinboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['kinboard/web/**', '.github/workflows/kinboard-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service worker version so phones pick up the update
        run: sed -i "s/const VERSION = 'kinboard-v1'/const VERSION = 'kinboard-${GITHUB_SHA::8}'/" kinboard/web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kinboard/web
      - id: deployment
        uses: actions/deploy-pages@v4
